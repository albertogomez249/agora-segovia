<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ágora · lámina de iconos</title>
<link rel="stylesheet" href="/shared/theme.css">
<style>
  body{background:var(--stone-01);padding:34px 30px 80px}
  h1{font-family:var(--display);font-size:26px;margin:0 0 6px}
  p.lede{color:var(--ink-04);font-size:13.5px;margin:0 0 30px;max-width:62ch;line-height:1.6}
  h2{font-family:var(--display);font-size:16px;margin:34px 0 14px;font-weight:400;
     letter-spacing:.02em;border-top:1px solid var(--line);padding-top:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:4px}
  .cell{background:var(--stone-00);border:1px solid var(--line);border-radius:10px;
        padding:16px 8px 10px;text-align:center}
  .cell .n{font-size:10px;color:var(--ink-04);margin-top:10px;letter-spacing:.02em}
  /* the three real sizes the app uses, with their real stroke weights */
  .s23 svg{width:23px;height:23px;stroke-width:1.5}
  .s16 svg{width:16px;height:16px;stroke-width:1.3}
  .s11 svg{width:11px;height:11px;stroke-width:1.1}
  .s48 svg{width:48px;height:48px;stroke-width:1.5}
  .row{display:flex;align-items:center;justify-content:center;gap:14px;min-height:50px}
  /* on the ink, which is where the tab bar and the pins live */
  .dark{background:var(--ink-00);border-radius:12px;padding:18px 10px;color:var(--stone-00)}
  .dark .cell{background:transparent;border-color:rgba(244,240,232,.12)}
  .dark .cell .n{color:#8C97A3}
  /* a strip that mimics the tab bar exactly */
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);background:rgba(251,249,245,.96);
        border:1px solid var(--line);border-radius:14px;padding:7px 6px;max-width:430px}
  .tabs b{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 4px;
          color:var(--ink-04);font-weight:400}
  .tabs b svg{width:23px;height:23px;stroke-width:1.5}
  .tabs b .lb{font-size:9.5px;letter-spacing:.06em;font-weight:600}
  .tabs b.on{color:var(--ink-00)}
  /* a pin exactly as the map draws it */
  .pins{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .pinb{display:inline-flex;align-items:center;gap:5px;padding:4px 9px 4px 6px;border-radius:999px;
        background:var(--stone-00);border:1px solid rgba(21,24,28,.14);
        box-shadow:0 3px 10px rgba(21,24,28,.22);white-space:nowrap;
        font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-00)}
  .pinb .d{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;color:#fff}
  .pinb .d svg{width:11px;height:11px;stroke-width:1.6}
</style></head><body>
<h1>Lámina de iconos</h1>
<p class="lede">Los mismos marcos a los cuatro tamaños que la app usa de verdad,
con el grosor de trazo de cada contexto. Si un icono se empasta a 11&nbsp;px o
pesa de más en la barra, aquí se ve antes de que lo vea nadie.</p>
<div id="out"></div>
<script src="/shared/icons.js"></script>
<script>
  const names = Object.keys(ICON);
  const sec = (title, cls, dark) =>
    `<h2>${title}</h2><div class="${dark ? 'dark' : ''}"><div class="grid">` +
    names.map(n => `<div class="cell ${cls}"><div class="row">${ICON[n]}</div>
      <div class="n">${n}</div></div>`).join('') + '</div></div>';

  document.getElementById('out').innerHTML =
    `<h2>La barra, tal cual</h2>
     <div class="tabs">
       ${[['map','Map',1],['amphora','Buy',0],['arch','Go out',0],
          ['colonnade','Campus',0],['bust','Card',0]].map(([i,l,on]) =>
         `<b class="${on?'on':''}">${ICON[i]}<span class="lb">${l}</span></b>`).join('')}
     </div>
     <h2>Los pines del mapa, tal cual</h2>
     <div class="pins">
       ${[['amphora','#8E3B22','€12.50'],['seal','#9C7246','€4.50'],
          ['spark','#6B3A6E','€10.00'],['ball','#2F6B46','€7.00'],
          ['mask','#7A4E86','€9.00'],['screen','#2C4C6B','€5.50'],
          ['racket','#1F6B6B','€9.00']].map(([i,c,p]) =>
         `<span class="pinb"><span class="d" style="background:${c}">${ICON[i]}</span>${p}</span>`).join('')}
     </div>` +
    sec('A 48 px — la geometría', 's48') +
    sec('A 23 px — la barra', 's23') +
    sec('A 16 px — en línea', 's16') +
    sec('A 11 px — dentro de un pin', 's11') +
    sec('A 23 px sobre tinta', 's23', true);
</script>
</body></html>
